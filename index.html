<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <div class="container py-5">

            <div class="weather-card mx-auto">

                <h1 class="app-title">
                    <i class="bi bi-cloud-sun-fill"></i>
                    Weather App
                </h1>

                <p class="subtitle">
                    Search any city and get live weather information
                </p>

                <!-- Search -->
                <div class="search-box">

                    <input
                        type="text"
                        id="cityInput"
                        class="form-control"
                        placeholder="Enter city name..."
                    >

                    <button id="searchBtn" class="btn search-btn">
                        <i class="bi bi-search"></i>
                        Search
                    </button>

                </div>

                <p id="errorMessage" class="error-message"></p>

                <!-- Loading -->
                <div id="loading" class="loading">
                    Loading weather...
                </div>

                <!-- Weather Result -->
                <div id="weatherResult" class="weather-result">

                    <div class="location">
                        <i class="bi bi-geo-alt-fill"></i>
                        <span id="cityName">New Delhi</span>
                    </div>

                    <div class="date" id="date"></div>

                    <div class="weather-icon">
                        <img
                            id="weatherIcon"
                            src="https://openweathermap.org/img/wn/01d@4x.png"
                            alt="Weather"
                        >
                    </div>

                    <div class="temperature">
                        <span id="temperature">--</span>°C
                    </div>

                    <div class="condition" id="condition">
                        Clear Sky
                    </div>

                    <!-- Weather Details -->
                    <div class="row weather-details g-3 mt-3">

                        <div class="col-6 col-md-4">
                            <div class="detail-box">
                                <i class="bi bi-droplet-fill"></i>
                                <h6>Humidity</h6>
                                <strong id="humidity">--%</strong>
                            </div>
                        </div>

                        <div class="col-6 col-md-4">
                            <div class="detail-box">
                                <i class="bi bi-wind"></i>
                                <h6>Wind Speed</h6>
                                <strong id="wind">-- km/h</strong>
                            </div>
                        </div>

                        <div class="col-12 col-md-4">
                            <div class="detail-box">
                                <i class="bi bi-thermometer-half"></i>
                                <h6>Feels Like</h6>
                                <strong id="feelsLike">--°C</strong>
                            </div>
                        </div>

                    </div>

                </div>

                <footer>
                    Weather App • HTML • CSS • JavaScript • API
                </footer>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
